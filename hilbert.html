        return this.placeZoomWindow(now, Lv.depth, Lv.maxArea, Lv.w, Lv.h, 0);
      };
      let win = tryDepth(L);
      if (win) return win;
      const rest = levels.slice().sort((a, b) => {
        const want = L ? L.area : 0;
        const da = Math.abs(a.area - want), db = Math.abs(b.area - want);
        if (da !== db) return da - db;
        return b.area - a.area;
      });
      for (let i = 0; i < rest.length; i++) {
        win = tryDepth(rest[i]);
        if (win) return win;
      }
      return null;
    }

    remapZoomRange() { // new parent grid: keep zoom depth, snap to the packed cell at now
      if (!this.layout) return null;
      const lock = this._zoomLock;
      const { grid } = this.layout;
      const cssW = this.tileW || this.cssW;
      const levels = hilbertZoomLevels(grid, cssW, this.start, this.end);
      let L = pickZoomLevel(levels, currentZoomArea());
      if (lock && lock.depth >= 1) {
        for (let i = 0; i < levels.length; i++) {
          if (levels[i].depth === lock.depth) { L = levels[i]; break; }
        }
      }
      if (!L) return null;
      return this.placeZoomWindow(nowMs(), L.depth, L.maxArea, L.w, L.h, 0);
    }

    zoomContainsNow(now) { // true while now's parent cell still sits in this packed cell
      if (!this.zoomBox || !this.layout) return false;
      const { grid, g } = this.layout;
      if (now < this.start || now >= this.end) return false;
      const nowIdx = clamp(Math.floor((now - this.start) / grid.cellDur), 0, grid.cells - 1);
      return boxContainsCell(this.zoomBox, g, nowIdx);
    }

    slideZoomWindow(now) { // same zoom family: next packed cell along the curve (the one now sits in)
      const lock = this._zoomLock;
      if (!lock || !this.layout || !(lock.depth >= 1) || !(lock.maxArea >= ZOOM_MIN_AREA)) return null;
      return this.placeZoomWindow(now, lock.depth, lock.maxArea, lock.wantW, lock.wantH, 0);
    }

    lockedZoomWin() { // reconstruct the current locked window while now is still inside it
      const lock = this._zoomLock;
      if (!lock || !this.zoomBox || !this.layout) return null;
      return this.winFromBox(this.zoomBox, lock.k, lock.depth);
    }

    _layoutCanvases() { // size four layers; hl is padded for the outside yellow frame
      const { grid, cssWidth } = this.layout;
      const cssHeight = this.layout.cssHeight != null
        ? Math.max(1, Math.round(this.layout.cssHeight))
        : Math.max(1, Math.round(cssWidth * grid.h / grid.w));
      this.cssW = cssWidth;
      this.cssH = cssHeight;
      if (!(this.tileW > 0)) this.tileW = cssWidth;
      if (!(this.tileH > 0)) this.tileH = cssHeight;
      const frameW = this.tileW;
      const frameH = this.tileH;
      const ox = Math.round((frameW - cssWidth) / 2);
      const oy = Math.round((frameH - cssHeight) / 2);
      this.wrap.style.width = frameW + "px";
      this.wrap.style.height = frameH + "px";
      this.base.width = grid.w;
      this.base.height = grid.h;
      this.base.style.width = cssWidth + "px";
      this.base.style.height = cssHeight + "px";
      this.base.style.left = ox + "px";
      this.base.style.top = oy + "px";
      const dpr = Math.min(DPR_MAX, window.devicePixelRatio || 1);
      this.dpr = dpr;
      this.hlPad = HL_PAD_PX; // yellow frame is drawn outside the pixels; hl canvas is padded so Fit does not clip it
      for (const c of [this.bounds, this.labels]) {
        c.width = Math.round(cssWidth * dpr);
        c.height = Math.round(cssHeight * dpr);
        c.style.width = cssWidth + "px";
        c.style.height = cssHeight + "px";
        c.style.left = ox + "px";
        c.style.top = oy + "px";
      }
      const pad = this.hlPad;
      this.hl.width = Math.round((cssWidth + pad * 2) * dpr);
      this.hl.height = Math.round((cssHeight + pad * 2) * dpr);
      this.hl.style.width = (cssWidth + pad * 2) + "px";
      this.hl.style.height = (cssHeight + pad * 2) + "px";
      this.hl.style.left = (ox - pad) + "px";
      this.hl.style.top = (oy - pad) + "px";
      this.ctxBounds.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.ctxLabels.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.ctxHl.setTransform(dpr, 0, 0, dpr, pad * dpr, pad * dpr);
    }

    setDisplayWidth(cssWidth) { // letterbox height from the grid aspect
      if (!this.layout || !(cssWidth > MIN_CSS_PX)) return;
      cssWidth = Math.max(MIN_CSS_PX, Math.round(cssWidth));
      const h = Math.max(MIN_CSS_PX, Math.round(cssWidth * this.layout.grid.h / this.layout.grid.w));
      this.setDisplaySize(cssWidth, h);
    }

    setDisplaySize(tileW, tileH) { // Fit slot is tileW×tileH; canvas letterboxes to the grid — never stretch
      if (!this.layout || !(tileW > MIN_CSS_PX) || !(tileH > MIN_CSS_PX)) return;
      tileW = Math.max(MIN_CSS_PX, Math.round(tileW));
      tileH = Math.max(MIN_CSS_PX, Math.round(tileH));
      const box = letterboxIn(this.layout.grid.w / this.layout.grid.h, tileW, tileH);
      const cssWidth = box.w;
      const cssHeight = box.h;
      if (this.tileW === tileW && this.tileH === tileH &&
          this.cssW === cssWidth && this.cssH === cssHeight &&
          this.layout.cssWidth === cssWidth && this.layout.cssHeight === cssHeight) return;
      this.tileW = tileW;
      this.tileH = tileH;
      this.layout.cssWidth = cssWidth;
      this.layout.cssHeight = cssHeight;
      this._layoutCanvases();
      this._renderBounds();
      this._lastKey = "";
      this.tick(nowMs(), true); // keep _liveLabel: same grid cells, only the CSS box changed
    }

    cellRangeForUnit(unit, now) { // cell [i0,i1) covering the unit that contains now
      if (now < this.start || now >= this.end) return null;
      const u0 = unit.start(now);
      const u1 = unit.end(now);
      const { grid } = this.layout;
      const i0 = clamp(Math.floor((u0 - this.start) / grid.cellDur), 0, grid.cells);
      const i1 = clamp(Math.ceil((u1 - this.start) / grid.cellDur), 0, grid.cells);
      if (i1 <= i0) return null;
      return [i0, i1];
    }

    boundingBox(i0, i1) { // axis-aligned cell box of a curve slice
      const { g } = this.layout;
      let minx = Infinity, miny = Infinity, maxx = -1, maxy = -1;
      for (let i = i0; i < i1; i++) {
        const x = g.xs[i], y = g.ys[i];
        if (x < minx) minx = x;
        if (y < miny) miny = y;
        if (x > maxx) maxx = x;
        if (y > maxy) maxy = y;
      }
      if (maxx < 0) return null;
      return { x: minx, y: miny, w: maxx - minx + 1, h: maxy - miny + 1 };
    }

    tick(now, force) { // fill along the curve up to now; tint the current coarsest unit; redraw labels
      if (!this.layout) return;
      const { grid, g, levels, levelIds, cellStart } = this.layout;
      const paintMs = Math.max(1, Math.min(LOOP_MAX_MS, grid.cellDur)); // inset: at least 1 Hz, no whole-second snap
      const nowKey = Math.floor(now / paintMs);
      let curId = null;
      if (levels[0] && now >= this.start && now < this.end) curId = levels[0].index(now);
      const key = nowKey + ":" + curId;
      if (!force && key === this._lastKey) return;
      const unitChanged = !this._lastKey.endsWith(":" + curId);
      this._lastKey = key;

      const img = this.ctxBase.createImageData(grid.w, grid.h);
      const buf = new Uint32Array(img.data.buffer);
      buf.fill(theme.surplus);
      const ids = levelIds[0];
      const n = grid.cells;
      const dur = grid.cellDur;
      for (let i = 0; i < n; i++) {
        const p = g.xs[i] + g.ys[i] * grid.w;
        const t0 = cellStart[i];
        const inCur = curId != null && ids && ids[i] === curId;
        if (now >= t0 + dur) buf[p] = inCur ? theme.curPast : theme.past; // elapsed
        else if (now >= t0) buf[p] = theme.head; // the living cell
        else buf[p] = inCur ? theme.curFuture : theme.future; // not yet
      }
      this.ctxBase.putImageData(img, 0, 0);
      this._renderLabels(now);
      if (force || unitChanged) this._renderOverlay(now, curId);
    }

    _renderOverlay(now, curId) { // current-unit outline + yellow zoom frame outside the cells
      const ctx = this.ctxHl;
      const pad = this.hlPad || 0;
      ctx.clearRect(-pad, -pad, this.cssW + pad * 2, this.cssH + pad * 2);
      if (!this.layout) return;
      const { grid, g, levelIds } = this.layout;
      const cw = this.cssW / grid.w;
      const ch = this.cssH / grid.h;
      const at = g.at;
      if (curId != null && levelIds[0]) {
        const ids = levelIds[0];
        const inside = (j) => j >= 0 && j < grid.cells && ids[j] === curId;
        ctx.strokeStyle = theme.currentOutline;
        ctx.lineWidth = CURRENT_OUTLINE_W;
        ctx.beginPath();
        for (let i = 0; i < grid.cells; i++) {
          if (ids[i] !== curId) continue;
          const x = g.xs[i], y = g.ys[i];
          if (x === 0 || !inside(at[y * grid.w + x - 1])) {
            ctx.moveTo(x * cw, y * ch);
            ctx.lineTo(x * cw, (y + 1) * ch);
          }
          if (x === grid.w - 1 || !inside(at[y * grid.w + x + 1])) {
            ctx.moveTo((x + 1) * cw, y * ch);
            ctx.lineTo((x + 1) * cw, (y + 1) * ch);
          }
          if (y === 0 || !inside(at[(y - 1) * grid.w + x])) {
            ctx.moveTo(x * cw, y * ch);
            ctx.lineTo((x + 1) * cw, y * ch);
          }
          if (y === grid.h - 1 || !inside(at[(y + 1) * grid.w + x])) {
            ctx.moveTo(x * cw, (y + 1) * ch);
            ctx.lineTo((x + 1) * cw, (y + 1) * ch);
          }
        }
        ctx.stroke();
      }
      if (this.zoomBox) {
        const b = this.zoomBox;
        const rx = b.x * cw;
        const ry = b.y * ch;
        const rw = b.w * cw;
        const rh = b.h * ch;
        ctx.strokeStyle = theme.zoom;
        ctx.lineWidth = ZOOM_FRAME_W;
        ctx.lineJoin = "miter";
        ctx.strokeRect(rx - ZOOM_FRAME_OUTSET, ry - ZOOM_FRAME_OUTSET, rw + ZOOM_FRAME_OUTSET * 2, rh + ZOOM_FRAME_OUTSET * 2); // outside the selection, not inset into pixels
      } else if (this.wrap.classList.contains("map-zoom")) {
        ctx.strokeStyle = theme.zoom;
        ctx.lineWidth = ZOOM_FRAME_W;
        ctx.lineJoin = "miter";
        ctx.strokeRect(-ZOOM_FRAME_OUTSET, -ZOOM_FRAME_OUTSET, this.cssW + ZOOM_FRAME_OUTSET * 2, this.cssH + ZOOM_FRAME_OUTSET * 2); // hug the letterboxed grid, not the Fit wrap
      }
    }

    currentFillRange(now) { // coarsest unit at now, or the next if that unit is almost the whole map
      if (!this.layout || !this.layout.levels[0]) return null;
      if (now < this.start || now >= this.end) return null;
      const unit = this.layout.levels[0];
      const a = Math.max(unit.start(now), this.start);
      const b = Math.min(unit.end(now), this.end);
      if (b <= a) return null;
      if ((b - a) / (this.end - this.start) > CURRENT_UNIT_MAX_SHARE) {
        if (!this.layout.levels[1]) return null;
        const u2 = this.layout.levels[1];
        const a2 = Math.max(u2.start(now), this.start);
        const b2 = Math.min(u2.end(now), this.end);
        if (b2 <= a2 || (b2 - a2) / (this.end - this.start) > CURRENT_UNIT_MAX_SHARE) return null;
        return { start: a2, end: b2, id: u2.id };
      }
      return { start: a, end: b, id: unit.id };
    }

    _strokeBoundIds(ctx, ids, lw, color) { // edges where neighbouring cells change unit id
      const { grid, g } = this.layout;
      const cw = this.cssW / grid.w;
      const ch = this.cssH / grid.h;
      const at = g.at;
      const nCells = grid.cells;
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.lineJoin = "miter";
      ctx.beginPath();
      for (let y = 0; y < grid.h; y++) {
        for (let x = 0; x < grid.w; x++) {
          const i = at[y * grid.w + x];
          if (i < 0 || i >= nCells) continue;
          const id = ids[i];
          if (x + 1 < grid.w) {
            const j = at[y * grid.w + x + 1];
            if (j >= 0 && j < nCells && ids[j] !== id) {
              const px = (x + 1) * cw;
              ctx.moveTo(px, y * ch);
              ctx.lineTo(px, (y + 1) * ch);
            }
          }
          if (y + 1 < grid.h) {
            const j = at[(y + 1) * grid.w + x];
            if (j >= 0 && j < nCells && ids[j] !== id) {
              const py = (y + 1) * ch;
              ctx.moveTo(x * cw, py);
              ctx.lineTo((x + 1) * cw, py);
            }
          }
        }
      }
      ctx.stroke();
    }

    _renderBounds() { // up to 3 local levels + inherited coarser edges on the inset
      const ctx = this.ctxBounds;
      const { grid, levels, levelIds, inherit } = this.layout;
      ctx.clearRect(0, 0, this.cssW, this.cssH);
      const cw = this.cssW / grid.w;
      const ch = this.cssH / grid.h;
      const labelLi = this.layout.labelLevel || 0;
      for (let li = levels.length - 1; li >= 0; li--) {
        const cellsPer = Math.max(1, levels[li].typical / grid.cellDur);
        const sidePx = Math.sqrt(cellsPer) * Math.min(cw, ch); // typical unit-block side on screen, e.g. ~8px for a minute
        const hair = li >= 2 || li > labelLi; // 3rd level, or anything finer than the labels (minutes under hour numbers)
        const lw = hair
          ? clamp(HAIR_GAIN * (sidePx / HAIR_REF_PX), HAIR_MIN, HAIR_MAX) // e.g. 0.5*(8/56)=0.07 → clamped to HAIR_MIN
          : (BOUND_W[li] || BOUND_W[2]);
        const color = hair
          ? theme.bound3
          : (li === 0 ? theme.bound1 : theme.bound2);
        this._strokeBoundIds(ctx, levelIds[li], lw, color);
      }
      if (inherit) {
        for (let i = 0; i < inherit.length; i++) {
          this._strokeBoundIds(ctx, inherit[i], INHERIT_W, theme.bound0);
        }
      }
    }

    _collectRegions(levelIndex) { // cells grouped by unit id, with bbox
      const { grid, g, levelIds } = this.layout;
      const ids = levelIds[levelIndex];
      const groups = new Map();
      for (let i = 0; i < grid.cells; i++) {
        const id = ids[i];
        let rec = groups.get(id);
        if (!rec) {
          rec = { id, idx: [], minx: g.xs[i], miny: g.ys[i], maxx: g.xs[i], maxy: g.ys[i] };
          groups.set(id, rec);
        }
        rec.idx.push(i);
        const x = g.xs[i], y = g.ys[i];
        if (x < rec.minx) rec.minx = x;
        if (y < rec.miny) rec.miny = y;
        if (x > rec.maxx) rec.maxx = x;
        if (y > rec.maxy) rec.maxy = y;
      }
      return [...groups.values()];
    }

    _renderLabels(now) { // layer-wide slot (square / 4×3 / 16×9); one font except a single small outlier
      const ctx = this.ctxLabels;
      ctx.clearRect(0, 0, this.cssW, this.cssH);
      const { grid, g, levels, labelLevel, cellStart } = this.layout;
      if (!levels.length) return;
      if (now == null) now = nowMs();
      const li = labelLevel || 0;
      const unit = levels[li];
      const regions = this._collectRegions(li);
      if (!regions.length) return;
      const cw = this.cssW / grid.w;
      const ch = this.cssH / grid.h;
      const dur = grid.cellDur;
      const pending = [];
      const texts = [];

      for (let r = 0; r < regions.length; r++) {
        const region = regions[r];
        const t = cellStart[region.idx[0]] + dur * 0.5;
        const text = unit.label(t);
        texts.push(text);
        const bw = region.maxx - region.minx + 1;
        const bh = region.maxy - region.miny + 1;
        const full = new Uint8Array(bw * bh);
        const past = new Uint8Array(bw * bh);
        const future = new Uint8Array(bw * bh);
        let nPast = 0, nFuture = 0, tMin = Infinity, tMax = -Infinity;
        for (let k = 0; k < region.idx.length; k++) {
          const i = region.idx[k];
          const mi = (g.ys[i] - region.miny) * bw + (g.xs[i] - region.minx);
          full[mi] = 1;
          const t0 = cellStart[i];
          const t1 = t0 + dur;
          if (t0 < tMin) tMin = t0;
          if (t1 > tMax) tMax = t1;
          if (t1 <= now) {
            past[mi] = 1;
            nPast++;
          } else if (t0 > now) {
            future[mi] = 1;
            nFuture++;
          }
        }
        const live = now >= tMin && now < tMax;
        let onFilled = tMax <= now;
        let placeMask = full;
        if (live) {
          if (nPast >= nFuture && nPast > 0) {
            placeMask = past;
            onFilled = true;
          } else if (nFuture > 0) {
            placeMask = future;
            onFilled = false;
          }
        }
        pending.push({
          text,
          n: region.idx.length,
          live,
          onFilled,
          placeMask,
          bw,
          bh,
          ox: region.minx,
          oy: region.miny,
          color: labelColor(onFilled, live)
        });
      }

      const kind = labelSlotKind(texts);
      const liveSlot = Math.floor(now / LABEL_LIVE_MS);
      const items = [];
      for (let r = 0; r < pending.length; r++) {
        const p = pending[r];
        const cached = this._liveLabel;
        if (p.live && cached && cached.slot === liveSlot && cached.text === p.text &&
            cached.ox === p.ox && cached.oy === p.oy &&
            cached.onFilled === p.onFilled && cached.kind === kind) {
          items.push({
            text: p.text,
            n: p.n,
            color: p.color,
            place: cached.place,
            ox: cached.ox,
            oy: cached.oy
          });
          continue;
        }
        const mid = maskCentroid(p.placeMask, p.bw, p.bh);
        const place = largestSlotInMask(p.placeMask, p.bw, p.bh, kind, mid.x, mid.y);
        const item = {
          text: p.text,
          n: p.n,
          color: p.color,
          place,
          ox: p.ox,
          oy: p.oy
        };
        if (p.live) {
          this._liveLabel = {
            slot: liveSlot, text: p.text, place, ox: p.ox, oy: p.oy,
            onFilled: p.onFilled, kind
          };
        }
        items.push(item);
      }

      const med = median(items.map((it) => it.n));
      const scored = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const pr = it.place;
        if (!pr || !pr.area || it.n < med * LABEL_TINY_FRAC) continue;
        scored.push({
          i,
          score: Math.min(pr.w * cw, pr.h * ch),
          px: fontFit(ctx, it.text, pr.w * cw, pr.h * ch)
        });
      }
      scored.sort((a, b) => a.score - b.score);
      let outlierI = -1;
      if (scored.length >= 2 && scored[0].score < LABEL_OUTLIER_RATIO * scored[1].score) {
        outlierI = scored[0].i;
      }
      let fontSize = Infinity;
      let outlierPx = LABEL_FALLBACK_PX;
      for (let s = 0; s < scored.length; s++) {
        if (scored[s].i === outlierI) {
          outlierPx = scored[s].px;
          continue;
        }
        if (scored[s].px < fontSize) fontSize = scored[s].px;
      }
      if (!isFinite(fontSize)) fontSize = scored.length ? scored[0].px : LABEL_FALLBACK_PX;
      fontSize = Math.min(fontSize, LABEL_MAX_PX);
      outlierPx = Math.min(outlierPx, LABEL_MAX_PX);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let lastPx = -1;
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const pr = it.place;
        if (!pr || !pr.area) continue;
        if (it.n < med * LABEL_TINY_FRAC) continue;
        const px = i === outlierI ? outlierPx : fontSize;
        if (px !== lastPx) {
          ctx.font = LABEL_FONT + px + LABEL_FONT_STACK;
          lastPx = px;
        }
        const tw = ctx.measureText(it.text).width;
        if (tw > pr.w * cw * LABEL_FIT_PAD || px > pr.h * ch * LABEL_FIT_PAD) continue;
        ctx.fillStyle = it.color;
        ctx.fillText(it.text, (it.ox + pr.x + pr.w / 2) * cw, (it.oy + pr.y + pr.h / 2) * ch);
      }
    }

    setZoomHighlight(box, range) { // yellow box on the parent; range is the inset interval
      this.zoomBox = box;
      this.zoomRange = range || null;
      if (!box && !this.zoomRange) this._zoomLock = null;
      if (!this.layout) return;
      const now = nowMs();
      const curId = this.layout.levels[0] && now >= this.start && now < this.end
        ? this.layout.levels[0].index(now) : null;
      this._renderOverlay(now, curId);
    }

    _onHover(e) { // system title from this pixel; mouse only — touch must not set title
      if (e.pointerType !== "mouse") return;
      const text = this._momentAt(e.clientX, e.clientY);
      if (text == null) {
        this._clearHoverTip();
        return;
      }
      if (this.wrap.getAttribute("title") !== text) this.wrap.title = text;
    }

    _onHoverEnd(e) {
      if (e.pointerType && e.pointerType !== "mouse") return;
      this._clearHoverTip();
    }

    _clearHoverTip() {
      this._tipIdx = -1;
      this.wrap.removeAttribute("title");
    }

    _momentAt(clientX, clientY) { // cell under the cursor → local instant; surplus / off-map → null
      if (!this.layout) return null;
      const { grid, g, cellStart } = this.layout;
      const r = this.base.getBoundingClientRect();
      if (!(r.width > 0) || !(r.height > 0)) return null;
      const gx = Math.floor((clientX - r.left) / r.width * grid.w);
      const gy = Math.floor((clientY - r.top) / r.height * grid.h);
      if (gx < 0 || gy < 0 || gx >= grid.w || gy >= grid.h) return null;
      const i = g.at[gy * grid.w + gx];
      if (i < 0 || i >= grid.cells) return null;
      if (i === this._tipIdx) return this.wrap.getAttribute("title");
      this._tipIdx = i;
      return formatMoment(cellStart[i], grid.cellDur);
    }
  }

  const presetBar = document.getElementById("presets");
  const arbitraryRow = document.getElementById("arbitrary");
  const arbFrom = document.getElementById("arb-from");
  const arbTo = document.getElementById("arb-to");
  const stage = document.getElementById("stage");
  const connectors = document.getElementById("connectors");
  const stackEl = document.getElementById("map-stack");
  const slots = [];

  function ensureSlot(i) { // create map tiles lazily; slot 0 is the parent
    while (slots.length <= i) {
      const block = document.createElement("div");
      block.className = "map-block";
      const wrap = document.createElement("div");
      wrap.className = slots.length > 0 ? "map map-zoom" : "map";
      const cap = document.createElement("div");
      cap.className = "caption";
      block.appendChild(wrap);
      block.appendChild(cap);
      stackEl.appendChild(block);
      slots.push({ block, map: new TimeMap(wrap, cap) });
    }
    slots[i].block.style.display = "";
    return slots[i];
  }

  function hideSlotsFrom(i) { // drop inset (and any further) tiles
    for (let k = i; k < slots.length; k++) {
      slots[k].block.style.display = "none";
      slots[k].map.setZoomHighlight(null);
    }
    if (i <= 1) requestAnimationFrame(drawAllConnectors); // month→day: SVG leaders outlive a hidden inset
  }

  let mode = "today";
  const layoutMode = "fit"; // only layout; Full was removed
  let arbitrary = null;
  let resizeTimer = 0;
  let arbTimer = 0; // Custom dates: relayout 1s after the last input
  let lastLayoutWidth = 0;
  let lastLayoutHeight = 0;
  let lastZoomKey = "";
  let lastNavStamp = ""; // day+month+year of the preset labels — retitle 30th / August / 2026 at midnight
  let chromeHidden = false; // F toggles the top bar; never written to localStorage
  let zoomSizeByMode = { today: 0, month: 0, year: 0, epoch: 0, arbitrary: 0 }; // parent-cell area per preset; 0 = automatic
  let zoomInBtn = null;
  let zoomOutBtn = null;
  const FRAME_KEY = "clock-hilbert-frame"; // localStorage: last preset + Custom dates + zoom per mode

  function currentZoomArea() { // stored yellow-box area for the active preset
    return zoomSizeByMode[mode] || 0;
  }

  function applyLayoutClass() { // Fit is the only layout; class drives the CSS lock
    document.documentElement.classList.add("fit-mode");
    document.body.classList.add("fit-mode");
  }

  function saveFrame() { // last preset + Custom dates + zoom area per mode
    try {
      const data = { mode: mode, layout: "fit", zoom: zoomSizeByMode };
      if (arbitrary && Number.isFinite(arbitrary.start) && Number.isFinite(arbitrary.end) && arbitrary.end > arbitrary.start) {
        data.arbitrary = { start: arbitrary.start, end: arbitrary.end };
      }
      localStorage.setItem(FRAME_KEY, JSON.stringify(data));
    } catch (err) {}
  }

  function loadFrame() { // restore last preset / Custom dates from localStorage
    try {
      const data = JSON.parse(localStorage.getItem(FRAME_KEY) || "null");
      if (!data || typeof data !== "object") return;
      if (data.arbitrary && Number.isFinite(+data.arbitrary.start) && Number.isFinite(+data.arbitrary.end) && +data.arbitrary.end > +data.arbitrary.start) {
        arbitrary = { start: +data.arbitrary.start, end: +data.arbitrary.end };
      }
      if (data.mode === "today" || data.mode === "month" || data.mode === "year" || data.mode === "epoch" || data.mode === "arbitrary") {
        if (data.mode !== "arbitrary" || arbitrary) mode = data.mode;
      }
      if (data.zoom && typeof data.zoom === "object") {
        const ids = ["today", "month", "year", "epoch", "arbitrary"];
        for (let i = 0; i < ids.length; i++) {
          const n = +data.zoom[ids[i]];
          if (Number.isFinite(n) && n >= 0) zoomSizeByMode[ids[i]] = n;
        }
      }
    } catch (err) {}
  }

  function navStamp(now) { // 30th / August / 2026 — include the day so midnight retitles the first button
    const d = new Date(now);
    return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  }

  function currentPresets() { // D / M / Y — current day, month, year
    return [
      { id: "today", label: "D" },
      { id: "month", label: "M" },
      { id: "year", label: "Y" },
      { id: "epoch", label: "Unix" },
      { id: "arbitrary", label: "Range" }
    ];
  }

  function rangeForMode(id, now) { // presets are just [start, end); Custom is stored inclusive-end + 1 day
    const d = new Date(now);
    if (id === "today") {
      return { start: startOfDay(d), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() };
    }
    if (id === "month") {
      return { start: startOfMonth(d), end: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() };
    }
    if (id === "year") {
      return { start: startOfYear(d), end: new Date(d.getFullYear() + 1, 0, 1).getTime() };
    }
    if (id === "epoch") {
      return { start: 0, end: UNIX32_END };
    }
    if (id === "arbitrary" && arbitrary) return arbitrary;
    return { start: startOfDay(d), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() };
  }

  function renderPresetBar() { // D / M / Y / Unix / Range, then + / −
    lastNavStamp = navStamp(nowMs());
    presetBar.innerHTML = "";
    currentPresets().forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = p.label;
      b.setAttribute("aria-pressed", p.id === mode ? "true" : "false");
      b.addEventListener("click", () => setMode(p.id));
      presetBar.appendChild(b);
    });
    const zoomWrap = document.createElement("div");
    zoomWrap.className = "zoom-btns";
    zoomInBtn = document.createElement("button");
    zoomInBtn.type = "button";
    zoomInBtn.innerHTML = '<span class="zoom-icon zoom-icon-sm" aria-hidden="true"></span>';
    zoomInBtn.setAttribute("aria-label", "Zoom in");
    zoomInBtn.addEventListener("click", () => nudgeZoomSize(-1));
    zoomOutBtn = document.createElement("button");
    zoomOutBtn.type = "button";
    zoomOutBtn.innerHTML = '<span class="zoom-icon zoom-icon-lg" aria-hidden="true"></span>';
    zoomOutBtn.setAttribute("aria-label", "Zoom out");
    zoomOutBtn.addEventListener("click", () => nudgeZoomSize(1));
    zoomWrap.appendChild(zoomInBtn);
    zoomWrap.appendChild(zoomOutBtn);
    presetBar.appendChild(zoomWrap);
    syncZoomButtons();
  }

  function setMode(id) { // cancel a pending Custom edit, then rebuild
    clearTimeout(arbTimer); // abandon a pending date edit if the user picked another preset
    mode = id;
    arbitraryRow.classList.toggle("open", id === "arbitrary");
    if (id === "arbitrary") {
      syncArbitraryBounds();
      if (!arbitrary) {
        const r = rangeForMode("today", nowMs());
        arbitrary = r;
        arbFrom.value = localDateValue(r.start);
        arbTo.value = localDateValue(r.end - 1);
      }
    }
    saveFrame();
    renderPresetBar();
    relayout();
  }

  function advanceEndedCustom(now) { // Custom that is over → next same-length window containing now
    if (!arbitrary || arbTimer) return false;
    const dur = arbitrary.end - arbitrary.start;
    if (!(dur > 0) || now < arbitrary.end) return false;
    const k = Math.floor((now - arbitrary.start) / dur);
    if (k < 1) return false;
    const start = arbitrary.start + k * dur;
    arbitrary = { start: start, end: start + dur };
    arbFrom.value = localDateValue(arbitrary.start);
    arbTo.value = localDateValue(arbitrary.end - 1);
    saveFrame();
    return true;
  }

  function followLiveCalendar(now) { // retitle 30th/August/2026; roll Custom if its window ended
    // Today / month / year are always the current period. Custom steps forward
    // by its own length when now is past the end. Epoch stays put.
    const rolledCustom = advanceEndedCustom(now);
    if (navStamp(now) !== lastNavStamp) {
      renderPresetBar();
      syncArbitraryBounds();
    } else if (rolledCustom) {
      syncArbitraryBounds();
    }
    if (rolledCustom && mode === "arbitrary") {
      relayout();
      return;
    }
    if (mode !== "today" && mode !== "month" && mode !== "year") return;
    const r = rangeForMode(mode, now);
    const main = slots[0] && slots[0].map;
    if (main && main.start === r.start && main.end === r.end) return;
    relayout();
  }

  function stageWidth() { // usable stage width, never below STAGE_MIN_W
    return Math.max(STAGE_MIN_W, Math.round(stage.clientWidth || document.documentElement.clientWidth - STAGE_GUTTER));
  }

  function pageIsPortrait() { // device upright — do not trust a collapsed stage or a short Chrome innerHeight
    if (typeof window.matchMedia === "function") {
      if (window.matchMedia("(orientation: portrait)").matches) return true;
      if (window.matchMedia("(orientation: landscape)").matches) return false;
    }
    const sw = screen && screen.width, sh = screen && screen.height;
    if (sw && sh && sw !== sh) return sh > sw;
    return window.innerHeight >= window.innerWidth;
  }

  function viewportRemainH() { // height left under the top bar; take the largest of Chrome's conflicting height APIs
    const vv = window.visualViewport;
    let viewH = Math.max(
      window.innerHeight || 0,
      (document.documentElement && document.documentElement.clientHeight) || 0,
      (vv && vv.height) || 0
    );
    const sw = screen && screen.width, sh = screen && screen.height;
    if (pageIsPortrait() && sw && sh && sh > sw && window.innerWidth > 0) {
      viewH = Math.max(viewH, Math.round(window.innerWidth * sh / sw));
    }
    const top = document.querySelector(".top-bar");
    const th = top ? top.getBoundingClientRect().height : 0;
    const topUsed = th > 0 ? th + CHROME_TOP_GAP : 0; // F-hidden bar has no height — do not keep CHROME_TOP_GAP
    return Math.max(AVAIL_H_MIN, viewH - topUsed - AVAIL_H_CHROME);
  }

  function slotAspect(w, h) { // w/h for pickGrid; on a portrait phone never ask for a landscape grid
    const measured = Math.max(1, h);
    if (pageIsPortrait()) {
      const tallH = Math.max(measured, viewportRemainH(), w * PORTRAIT_MIN_H_OVER_W);
      return clamp(w / tallH, ASPECT_MIN, 1 - GRID_ORIENT_EPS);
    }
    return clamp(w / measured, ASPECT_MIN, ASPECT_MAX);
  }

  function layoutMetrics() { // slot the day map should fill: stage box, but never shorter than the viewport remainder
    const box = availBox();
    const cap = slots[0] && slots[0].block.style.display !== "none"
      ? captionExtra(slots[0]) : CAPTION_FALLBACK;
    const width = Math.max(STAGE_MIN_W, box.w);
    const slotH = Math.max(AVAIL_H_MIN, box.h - cap);
    const availH = Math.max(slotH, viewportRemainH());
    return { width, aspect: slotAspect(width, availH), availH: availH };
  }

  function insetDismissible(main) { // Today: − past coarsest hides the second panel (parent may be ~1s)
    if (mode === "today") return true;
    return !!(main && main.layout && main.layout.grid.cellDur <= INSET_MAX_D);
  }

  function insetSlotOn() { // second tile is visible
    return !!(slots[1] && slots[1].block.style.display !== "none");
  }

  function zoomChainKey(now) { // detect when the inset window must move
    const main = slots[0] && slots[0].map;
    if (!main || !main.layout) return "";
    if (insetDismissible(main) && currentZoomArea() <= 0) return "none"; // day default: one panel
    if (!main.zoomRange) return listZoomLadder(now).uniq.length ? "need" : "none";
    if (!main.zoomContainsNow(now)) {
      const dur = main.layout.grid.cellDur;
      const idx = clamp(Math.floor((now - main.start) / dur), 0, main.layout.grid.cells - 1);
      return "moved:" + idx; // retry each parent cell until the locked box can follow
    }
    const b = main.zoomBox;
    return b ? ("box:" + b.x + "," + b.y + "," + b.w + "x" + b.h) : (main.zoomRange.start + "-" + main.zoomRange.end);
  }

  function chromeHeight() { // top bar + caption slack when the stage box is unknown
    let h = CHROME_BASE;
    const top = document.querySelector(".top-bar");
    const th = top ? top.getBoundingClientRect().height : 0;
    if (th > 0) h += th + CHROME_TOP_GAP; // dates live in the top-bar; skip when F-hidden
    return h;
  }

  function fitSlots() { // visible maps with a layout
    return slots.filter((s) => s.block.style.display !== "none" && s.map.layout);
  }

  function availBox() { // stage inner box in Fit mode
    if (layoutMode === "fit") {
      const st = getComputedStyle(stage);
      const pl = parseFloat(st.paddingLeft) || 0;
      const pr = parseFloat(st.paddingRight) || 0;
      const pt = parseFloat(st.paddingTop) || 0;
      const pb = parseFloat(st.paddingBottom) || 0;
      const w = stage.clientWidth - pl - pr;
      const h = stage.clientHeight - pt - pb;
      if (w > STAGE_USE_CLIENT_MIN && h > STAGE_USE_CLIENT_MIN) return { w: w, h: h };
    }
    return {
      w: stageWidth(),
      h: Math.max(STAGE_MIN_W, window.innerHeight - chromeHeight())
    };
  }

  function captionExtra(slot) { // caption height reserved under the tile
    const el = slot.block.querySelector(".caption");
    if (!el) return CAPTION_FALLBACK;
    return Math.max(CAPTION_MIN, Math.ceil(el.getBoundingClientRect().height) + CAPTION_PAD);
  }

  function stageEdgeX() { // horizontal padding from a map to the window edge (body + stage)
    const body = getComputedStyle(document.body);
    const st = getComputedStyle(stage);
    const bodyX = Math.max(parseFloat(body.paddingLeft) || 0, parseFloat(body.paddingRight) || 0);
    const stageX = Math.max(parseFloat(st.paddingLeft) || 0, parseFloat(st.paddingRight) || 0, FIT_PAD);
    return bodyX + stageX;
  }

  function rowStackGap() { // between row tiles; >= stage edge, plus frames so they do not overlap
    return stageEdgeX() + STACK_ROW_FRAME;
  }

  function packFit(availW, availH) { // equal tiles; row vs column = more map area
    const vis = fitSlots();
    const n = vis.length;
    if (!n) return { dir: "col", widths: [], heights: [] };
    const caps = vis.map(captionExtra);
    const capMax = Math.max.apply(null, caps);
    const capSum = caps.reduce((a, b) => a + b, 0);
    const colGap = n > 1 ? STACK_COL_GAP : 0;
    const rowGap = n > 1 ? rowStackGap() : 0;

    if (n === 1) {
      const r = vis[0].map.layout.grid.h / vis[0].map.layout.grid.w;
      const w = Math.max(TILE_MIN, Math.min(availW, Math.floor((availH - caps[0]) / Math.max(1e-6, r))));
      return { dir: "col", widths: [w], heights: [Math.max(TILE_MIN, Math.round(w * r))] };
    }

    const colW = Math.max(TILE_MIN, Math.floor(availW));
    const colH = Math.max(TILE_MIN, Math.floor((availH - capSum - colGap) / n));
    const rowW = Math.max(TILE_MIN, Math.floor((availW - rowGap) / n)); // half after the center gutter
    const rowH = Math.max(TILE_MIN, Math.floor(availH - capMax));
    const col = {
      dir: "col",
      widths: vis.map(() => colW),
      heights: vis.map(() => colH),
      area: n * colW * colH
    };
    const row = {
      dir: "row",
      widths: vis.map(() => rowW),
      heights: vis.map(() => rowH),
      area: n * rowW * rowH
    };
    if (pageIsPortrait()) return col; // upright screen: always stack, even if a row scores more area
    return row.area > col.area ? row : col;
  }

  function applySlotBox(slot, tileW, tileH) { // Fit budget is tileW×tileH; row inset wrap matches the parent tile
    slot.map.setDisplaySize(tileW, tileH);
    slot.block.style.width = tileW + "px";
    slot.block.style.height = (tileH + captionExtra(slot)) + "px";
  }

  function clearSlotBoxes() { // Today one-panel: let the map size itself, do not lock Fit tiles
    for (let i = 0; i < slots.length; i++) {
      slots[i].block.style.width = "";
      slots[i].block.style.height = "";
    }
  }

  function applyFitPack(pack, now, rebuildGrids) { // equal tiles; optionally rebuild the parent grid
    stackEl.classList.toggle("fit-row", pack.dir === "row");
    stackEl.classList.toggle("fit-col", pack.dir !== "row");
    const vis = fitSlots();
    stackEl.style.setProperty("--stack-row-gap", pack.dir === "row" && vis.length > 1 ? rowStackGap() + "px" : "0px");
    const w = Math.max(TILE_MIN, Math.round(pack.widths[0]));
    const h = Math.max(TILE_MIN, Math.round(pack.heights[0]));
    if (rebuildGrids && vis[0]) {
      vis[0].map.rebuild(w, clamp(w / h, ASPECT_MIN, ASPECT_MAX)); // two-panel: grid matches the tile, do not force portrait
      updateZoom(now, true, w);
    }
    const vis2 = fitSlots();
    for (let i = 0; i < vis2.length; i++) {
      applySlotBox(vis2[i], w, h);
    }
  }

  function rebuildNatural(main) { // Today, one panel: grid follows the page — portrait phone → tall grid
    const metrics = layoutMetrics();
    const box = availBox();
    const cap = slots[0] ? captionExtra(slots[0]) : CAPTION_FALLBACK;
    const slotW = Math.max(TILE_MIN, box.w);
    const slotH = Math.max(TILE_MIN, metrics.availH, box.h - cap);
    main.rebuild(slotW, slotAspect(slotW, slotH));
    if (slotW > MIN_CSS_PX && slotH > MIN_CSS_PX) main.setDisplaySize(slotW, slotH);
  }

  function relayout() { // pick range → rebuild parent → optional inset → Fit pack → shrink if overflow
    applyLayoutClass();
    const now = nowMs();
    const range = rangeForMode(mode, now);
    lastLayoutWidth = stageWidth();
    lastLayoutHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const main = ensureSlot(0).map;
    main.setRange(range.start, range.end);
    lastZoomKey = "";
    stackEl.classList.remove("fit-row", "fit-col");
    stackEl.style.setProperty("--stack-row-gap", "0px");

    if (mode === "today") {
      rebuildNatural(main);
      updateZoom(now, true);
      if (fitSlots().length < 2) { // one panel: do not rebuild into Fit tiles
        clearSlotBoxes();
        enforceFitInStage();
        syncZoomButtons();
        return;
      }
    } else {
      const box = availBox();
      const wide = !pageIsPortrait() && box.w >= box.h * WIDE_STAGE_RATIO;
      const rowGap = wide ? rowStackGap() : 0;
      const probeW = wide ? Math.max(STAGE_MIN_W, Math.floor((box.w - rowGap) / 2)) : Math.max(STAGE_MIN_W, box.w);
      const probeH = wide ? Math.max(AVAIL_H_MIN, box.h - STAGE_GUTTER) : Math.max(AVAIL_H_MIN, Math.floor((box.h - PROBE_ROW_CAP) / 2));
      main.rebuild(probeW, clamp(probeW / probeH, ASPECT_MIN, ASPECT_MAX));
      updateZoom(now, true, probeW);
    }

    for (let i = 0; i < 3; i++) {
      const pack = packFit(availBox().w, availBox().h);
      if (!pack.widths.length) break;
      const same =
        (pack.dir === "row" ? stackEl.classList.contains("fit-row") : stackEl.classList.contains("fit-col")) &&
        visWidthClose(pack);
      applyFitPack(pack, now, !same);
      if (same) break;
    }
    enforceFitInStage();
    enforceRowGap();
    syncZoomButtons();
  }

  function fitPaintBounds() { // union of map + highlight + caption, for overflow shrink
    const vis = fitSlots();
    let minL = Infinity, minT = Infinity, maxR = -Infinity, maxB = -Infinity;
    for (let i = 0; i < vis.length; i++) {
      const hl = vis[i].map.hl;
      const wrap = vis[i].map.wrap;
      const cap = vis[i].block.querySelector(".caption");
      const boxes = [hl, wrap, cap];
      for (let b = 0; b < boxes.length; b++) {
        if (!boxes[b]) continue;
        const r = boxes[b].getBoundingClientRect();
        if (!r.width && !r.height) continue;
        minL = Math.min(minL, r.left);
        minT = Math.min(minT, r.top);
        maxR = Math.max(maxR, r.right);
        maxB = Math.max(maxB, r.bottom);
      }
    }
    return { minL: minL, minT: minT, maxR: maxR, maxB: maxB };
  }

  function enforceFitInStage() { // uniform shrink if paint (incl. yellow frame) overflows the stage; grid unchanged
    const vis = fitSlots();
    if (!vis.length) return;
    const stageRect = stage.getBoundingClientRect();
    const pad = FIT_PAD;
    const inner = {
      left: stageRect.left + pad,
      top: stageRect.top + pad,
      right: stageRect.right - pad,
      bottom: stageRect.bottom - pad
    };
    const b = fitPaintBounds();
    if (!Number.isFinite(b.minL)) return;
    const contentW = Math.max(1, b.maxR - b.minL);
    const contentH = Math.max(1, b.maxB - b.minT);
    const innerW = Math.max(TILE_MIN, inner.right - inner.left);
    const innerH = Math.max(TILE_MIN, inner.bottom - inner.top);
    const overflow = b.minL < inner.left - OVERFLOW_SLACK || b.minT < inner.top - OVERFLOW_SLACK ||
      b.maxR > inner.right + OVERFLOW_SLACK || b.maxB > inner.bottom + OVERFLOW_SLACK;
    if (!overflow) return;
    const s = Math.min(innerW / contentW, innerH / contentH) * FIT_SHRINK;
    if (!(s < FIT_SHRINK_EPS) || s <= 0) return;
    const tw = vis[0].map.tileW || vis[0].map.cssW;
    const th = vis[0].map.tileH || vis[0].map.cssH;
    for (let i = 0; i < vis.length; i++) {
      applySlotBox(vis[i], Math.max(TILE_MIN, Math.floor(tw * s)), Math.max(TILE_MIN, Math.floor(th * s)));
    }
    requestAnimationFrame(drawAllConnectors);
  }

  function panelPaintX(slot) { // painted left/right of the map, including yellow outline / hl pad
    const wrap = slot.map.wrap.getBoundingClientRect();
    let left = wrap.left;
    let right = wrap.right;
    const hl = slot.map.hl;
    if (hl) {
      const r = hl.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) {
        left = Math.min(left, r.left);
        right = Math.max(right, r.right);
      }
    }
    return { left: left, right: right };
  }

  function enforceRowGap() { // row: gap between maps ≥ each map's margin to the window edge
    if (!stackEl.classList.contains("fit-row")) return;
    const vis = fitSlots();
    if (vis.length < 2) return;
    const vw = document.documentElement.clientWidth;
    let shrunk = false;
    for (let k = 0; k < 4; k++) {
      const xs = vis.map(panelPaintX);
      xs.sort((a, b) => a.left - b.left);
      const gap = xs[1].left - xs[0].right;
      const side = Math.min(xs[0].left, vw - xs[1].right);
      if (gap + OVERFLOW_SLACK >= side) {
        if (shrunk) requestAnimationFrame(drawAllConnectors);
        return;
      }
      shrunk = true;
      const s = FIT_SHRINK;
      const tw = vis[0].map.tileW || vis[0].map.cssW;
      const th = vis[0].map.tileH || vis[0].map.cssH;
      for (let i = 0; i < vis.length; i++) {
        applySlotBox(vis[i], Math.max(TILE_MIN, Math.floor(tw * s)), Math.max(TILE_MIN, Math.floor(th * s)));
      }
    }
    if (shrunk) requestAnimationFrame(drawAllConnectors);
  }

  function visWidthClose(pack) { // pack matches current tiles within PACK_CLOSE_PX
    const vis = fitSlots();
    if (vis.length !== pack.widths.length) return false;
    for (let i = 0; i < vis.length; i++) {
      const tw = vis[i].map.tileW || vis[i].map.cssW;
      const th = vis[i].map.tileH || vis[i].map.cssH;
      if (Math.abs(tw - pack.widths[i]) > PACK_CLOSE_PX) return false;
      if (Math.abs(th - pack.heights[i]) > PACK_CLOSE_PX) return false;
    }
    return true;
  }

  function scheduleRelayout() { // ignore sub-RESIZE_EPS jitter (mobile chrome hide)
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const w = stageWidth();
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      if (Math.abs(w - lastLayoutWidth) < RESIZE_EPS && Math.abs(h - lastLayoutHeight) < RESIZE_EPS) {
        requestAnimationFrame(drawAllConnectors);
        return;
      }
      relayout();
    }, RESIZE_DEBOUNCE_MS);
  }

  function updateZoom(now, force, insetCssWidth, forcedWin) { // one inset; parent ≤1s stays one panel until +
    const main = slots[0] && slots[0].map;
    if (!main || !main.layout) return;
    if (!forcedWin && insetDismissible(main) && currentZoomArea() <= 0) {
      main.setZoomHighlight(null);
      hideSlotsFrom(1);
      lastZoomKey = "none";
      requestAnimationFrame(drawAllConnectors);
      syncZoomButtons();
      return;
    }
    const minute = Math.floor(now / MS_MIN);
    let win = forcedWin || null;
    if (!win && !force && main._zoomLock && main.zoomContainsNow(now)) {
      win = main.lockedZoomWin();
    }
    if (!win && !force && main._zoomLock) win = main.slideZoomWindow(now);
    if (!win) {
      win = main.pickZoomWindow(now);
      if (!force && win && main._zoomLock && win.depth !== main._zoomLock.depth) {
        win = main.slideZoomWindow(now) || win;
      }
    }
    if (!win && main._zoomLock && main.zoomContainsNow(now)) win = main.lockedZoomWin();
    if (win) {
      main._zoomLock = { depth: win.depth, maxArea: win.maxArea || win.area, wantW: win.wantW, wantH: win.wantH, w: win.box.w, h: win.box.h, k: win.k, cssW: main.cssW };
      main._zoomMinute = minute;
    }
    if (!win) {
      main.setZoomHighlight(null);
      hideSlotsFrom(1);
      lastZoomKey = "none";
      requestAnimationFrame(drawAllConnectors);
      syncZoomButtons();
      return;
    }
    const cssW = Math.max(TILE_MIN, Math.round(insetCssWidth || main.cssW));
    const layoutKey = (win.depth || 0) + ":" + win.box.x + "," + win.box.y + ":" + win.box.w + "x" + win.box.h + "k" + win.k + "@" + cssW;
    main.setZoomHighlight(win.box, { start: win.start, end: win.end });
    const inset = ensureSlot(1).map;
    main._zoomAspect = main.layout.grid.w / main.layout.grid.h;
    if (main.tileW > MIN_CSS_PX && main.tileH > MIN_CSS_PX) {
      inset.tileW = main.tileW;
      inset.tileH = main.tileH;
    }
    if (force || inset._cropKey !== layoutKey) {
      inset.rebuildZoom(cssW, main.layout, win);
      inset._cropKey = layoutKey;
    }
    hideSlotsFrom(2);
    lastZoomKey = zoomChainKey(now);
    if (main.tileW > MIN_CSS_PX && main.tileH > MIN_CSS_PX) {
      applySlotBox(slots[1], main.tileW, main.tileH);
    } else {
      inset.setDisplayWidth(main.cssW);
    }
    requestAnimationFrame(drawAllConnectors);
    syncZoomButtons();
  }

  function zoomWinKey(win) { // identity of a yellow-box window
    return win.start + "-" + win.end + ":" + win.box.w + "x" + win.box.h;
  }

  function listZoomLadder(now) { // tree depths, small→large; idx is the locked depth
    const main = slots[0] && slots[0].map;
    if (!main || !main.layout) return { uniq: [], idx: -1 };
    const { grid } = main.layout;
    const cssW = main.tileW || main.cssW;
    const levels = hilbertZoomLevels(grid, cssW, main.start, main.end);
    const nowIdx = (now >= main.start && now < main.end)
      ? clamp(Math.floor((now - main.start) / grid.cellDur), 0, grid.cells - 1)
      : 0;
    const uniq = [];
    for (let t = 0; t < levels.length; t++) {
      const L = levels[t];
      if (!pickHilbertLeaf(grid.w, grid.h, nowIdx, L.depth, grid, cssW, main.start, main.end)) continue;
      uniq.push({
        box: { x: 0, y: 0, w: L.w, h: L.h },
        w: L.w,
        h: L.h,
        area: L.area,
        k: L.k,
        depth: L.depth,
        start: 0,
        end: 0
      });
    }
    uniq.sort((a, b) => a.area - b.area);
    const lock = main._zoomLock;
    let idx = -1;
    if (lock && lock.depth >= 1) {
      for (let i = 0; i < uniq.length; i++) {
        if (uniq[i].depth === lock.depth) { idx = i; break; }
      }
    }
    if (idx < 0 && lock && lock.wantW >= 1 && lock.wantH >= 1) {
      for (let i = 0; i < uniq.length; i++) {
        if (uniq[i].w === lock.wantW && uniq[i].h === lock.wantH) { idx = i; break; }
      }
    }
    if (idx < 0 && lock && lock.w >= 1 && lock.h >= 1) {
      for (let i = 0; i < uniq.length; i++) {
        if (uniq[i].w === lock.w && uniq[i].h === lock.h) { idx = i; break; }
      }
    }
    if (idx < 0 && main.zoomBox) {
      for (let i = 0; i < uniq.length; i++) {
        if (uniq[i].w === main.zoomBox.w && uniq[i].h === main.zoomBox.h) { idx = i; break; }
      }
    }
    if (idx < 0 && main.zoomBox) {
      const area = main.zoomBox.w * main.zoomBox.h;
      let best = Infinity;
      for (let i = 0; i < uniq.length; i++) {
        const d = Math.abs(uniq[i].area - area);
        if (d < best) { best = d; idx = i; }
      }
    }
    if (idx < 0 && currentZoomArea() > 0 && currentZoomArea() < 1e14) {
      const want = currentZoomArea();
      let best = Infinity;
      for (let i = 0; i < uniq.length; i++) {
        const d = Math.abs(uniq[i].area - want);
        if (d < best) { best = d; idx = i; }
      }
    }
    return { uniq: uniq, idx: idx };
  }

  function syncZoomButtons() { // disable +/− when that step does not exist
    if (!zoomInBtn || !zoomOutBtn) return;
    const main = slots[0] && slots[0].map;
    const lad = listZoomLadder(nowMs());
    const n = lad.uniq.length;
    const dismiss = insetDismissible(main);
    const on = !!(main && main.zoomRange && insetSlotOn());
    if (dismiss && !on) {
      zoomInBtn.disabled = n < 1;
      zoomOutBtn.disabled = true;
      return;
    }
    const idx = lad.idx < 0 ? 0 : lad.idx;
    zoomInBtn.disabled = n < 1 || idx <= 0;
    zoomOutBtn.disabled = dismiss ? false : (n < 2 || idx >= n - 1);
  }

  function hideFineInset() { // parent ≤1s: − past the coarsest window drops the second panel
    zoomSizeByMode[mode] = 0;
    saveFrame();
    const main = slots[0] && slots[0].map;
    if (main) main.setZoomHighlight(null);
    hideSlotsFrom(1);
    lastZoomKey = "none";
    relayout();
  }

  function nudgeZoomSize(dir) { // +1 larger yellow box, −1 smaller; + / ↑ send −1
    const main = slots[0] && slots[0].map;
    if (!main || !main.layout) return;
    const now = nowMs();
    const lad = listZoomLadder(now);
    const dismiss = insetDismissible(main);
    const on = !!(main.zoomRange && insetSlotOn());
    if (dismiss && !on) {
      if (dir >= 0 || !lad.uniq.length) return;
      zoomSizeByMode[mode] = 1e15; // coarsest after relayout — clamp to sliceCap on the new grid
      saveFrame();
      relayout();
      return;
    }
    if (!lad.uniq.length) {
      if (dismiss && on && dir > 0) hideFineInset();
      return;
    }
    let idx = lad.idx;
    if (idx < 0) {
      const want = currentZoomArea();
      if (on && want > 0 && want < 1e14) {
        let best = Infinity;
        for (let i = 0; i < lad.uniq.length; i++) {
          const d = Math.abs(lad.uniq[i].area - want);
          if (d < best) { best = d; idx = i; }
        }
      } else {
        idx = on ? lad.uniq.length - 1 : 0;
      }
    }
    const next = idx + dir;
    if (next >= lad.uniq.length && dismiss && dir > 0) {
      hideFineInset();
      return;
    }
    if (next < 0 || next >= lad.uniq.length) return;
    const win = lad.uniq[next];
    zoomSizeByMode[mode] = win.area;
    saveFrame();
    main._zoomLock = null; // new zoom level — size may change; placeZoomWindow re-locks
    main._zoomMinute = Math.floor(now / MS_MIN);
    updateZoom(now, true);
  }

  function drawAllConnectors() { // two leaders: outer yellow frame → outer inset frame
    const svgNS = "http://www.w3.org/2000/svg";
    while (connectors.firstChild) connectors.removeChild(connectors.firstChild);
    const stageRect = stage.getBoundingClientRect();
    connectors.setAttribute("viewBox", "0 0 " + stageRect.width + " " + stageRect.height);
    connectors.setAttribute("width", String(stageRect.width));
    connectors.setAttribute("height", String(stageRect.height));
    const parentOut = INSET_FRAME_OUT; // yellow stroke sits outside the cells
    for (let i = 0; i < slots.length - 1; i++) {
      const a = slots[i];
      const b = slots[i + 1];
      if (a.block.style.display === "none" || b.block.style.display === "none") continue;
      const box = a.map.zoomBox;
      if (!box || !a.map.layout) continue;
      const grid = a.map.layout.grid;
      const mainPaint = a.map.base.getBoundingClientRect();
      const insetPaint = b.map.base.getBoundingClientRect();
      const cw = mainPaint.width / grid.w;
      const ch = mainPaint.height / grid.h;
      const ox = mainPaint.left - stageRect.left;
      const oy = mainPaint.top - stageRect.top;
      const L = ox + box.x * cw - parentOut;
      const T = oy + box.y * ch - parentOut;
      const R = ox + (box.x + box.w) * cw + parentOut;
      const B = oy + (box.y + box.h) * ch + parentOut;
      const iL = insetPaint.left - stageRect.left - parentOut;
      const iT = insetPaint.top - stageRect.top - parentOut;
      const iR = insetPaint.right - stageRect.left + parentOut;
      const iB = insetPaint.bottom - stageRect.top + parentOut;
      const side = stackEl.classList.contains("fit-row");
      const corners = side ? [ // row: outer right of parent frame → outer left of inset frame
        [R, T, iL, iT],
        [R, B, iL, iB]
      ] : [ // column / stack: outer bottom of parent frame → outer top of inset frame
        [L, B, iL, iT],
        [R, B, iR, iT]
      ];
      for (let k = 0; k < corners.length; k++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", corners[k][0]);
        line.setAttribute("y1", corners[k][1]);
        line.setAttribute("x2", corners[k][2]);
        line.setAttribute("y2", corners[k][3]);
        connectors.appendChild(line);
      }
    }
  }

  function todayDateValue() { // civil day of nowMs — Custom from/to hinge
    return localDateValue(startOfDay(new Date(nowMs())));
  }

  function syncArbitraryBounds() { // from: today and earlier; to: today and later
    const today = todayDateValue();
    arbFrom.max = today;
    arbTo.min = today;
    if (arbFrom.value && arbFrom.value > today) arbFrom.value = today;
    if (arbTo.value && arbTo.value < today) arbTo.value = today;
  }

  function applyArbitraryFromInputs() { // date inputs are inclusive; engine range is [start, end)
    syncArbitraryBounds();
    const a = parseDateInput(arbFrom.value);
    const b = parseDateInput(arbTo.value);
    const today = startOfDay(new Date(nowMs()));
    if (!Number.isFinite(a) || !Number.isFinite(b) || b < a) return;
    if (a > today || b < today) return;
    const end = new Date(b);
    end.setDate(end.getDate() + 1); // date inputs are inclusive; engine range is [start, end)
    const endMs = end.getTime();
    if (mode === "arbitrary" && arbitrary && arbitrary.start === a && arbitrary.end === endMs) return;
    arbitrary = { start: a, end: endMs };
    mode = "arbitrary";
    arbitraryRow.classList.add("open");
    saveFrame();
    renderPresetBar();
    relayout();
  }

  function scheduleArbitraryApply() { // Custom: relayout ARB_DEBOUNCE_MS after last edit
    clearTimeout(arbTimer);
    arbTimer = setTimeout(applyArbitraryFromInputs, ARB_DEBOUNCE_MS);
  }

  // Custom dates debounce; resize/orientation rebuild; tick aligned to the finest cell.
  arbFrom.addEventListener("input", scheduleArbitraryApply);
  arbTo.addEventListener("input", scheduleArbitraryApply);

  function setChromeHidden(on) { // hide D/M/Y bar and rebuild the maps into the freed space
    chromeHidden = !!on;
    document.body.classList.toggle("chrome-hidden", chromeHidden);
    lastLayoutWidth = 0;
    lastLayoutHeight = 0;
    relayout();
  }

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return; // leave browser Find / shortcuts alone
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "f") {
      e.preventDefault();
      setChromeHidden(!chromeHidden);
      return;
    }
    if (k === "ArrowUp" || k === "ArrowDown" || k === "+" || k === "-" || k === "=" || k === "_") {
      e.preventDefault();
      const zoomIn = k === "ArrowUp" || k === "+" || k === "=";
      nudgeZoomSize(zoomIn ? -1 : 1); // + / ↑ smaller window; − / ↓ larger
      return;
    }
    const modes = { d: "today", m: "month", y: "year", u: "epoch" };
    if (!modes[k]) return;
    e.preventDefault();
    setMode(modes[k]);
  });

  window.addEventListener("resize", scheduleRelayout);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleRelayout);
  if (typeof window.matchMedia === "function") {
    const orientMq = window.matchMedia("(orientation: portrait)");
    const onOrient = () => { lastLayoutWidth = 0; scheduleRelayout(); };
    if (orientMq.addEventListener) orientMq.addEventListener("change", onOrient);
    else if (orientMq.addListener) orientMq.addListener(onOrient);
  }
  window.addEventListener("orientationchange", () => {
    lastLayoutWidth = 0;
    setTimeout(relayout, ORIENT_RELAYOUT_MS);
  });
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(scheduleRelayout).observe(stage);
  }

  function loop() { // tick every cell; realign to cellDur so the head cell steps cleanly
    const now = nowMs();
    followLiveCalendar(now);
    let finest = LOOP_MAX_MS;
    for (let i = 0; i < slots.length; i++) {
      if (slots[i].block.style.display === "none" || !slots[i].map.layout) continue;
      slots[i].map.tick(now);
      finest = Math.min(finest, slots[i].map.layout.grid.cellDur);
    }
    if (zoomChainKey(now) !== lastZoomKey) updateZoom(now);
    const step = Math.max(LOOP_MIN_MS, Math.min(LOOP_MAX_MS, finest));
    setTimeout(loop, clamp(step - (now % step), LOOP_MIN_MS, LOOP_MAX_MS));
  }

  loadTheme();
  loadFrame();
  applyLayoutClass();
  renderPresetBar();
  arbitraryRow.classList.toggle("open", mode === "arbitrary");
  const now = nowMs();
  advanceEndedCustom(now);
  if (arbitrary) {
    arbFrom.value = localDateValue(arbitrary.start);
    arbTo.value = localDateValue(arbitrary.end - 1);
  } else {
    const today = rangeForMode("today", now);
    arbFrom.value = localDateValue(today.start);
    arbTo.value = localDateValue(today.end - 1);
  }
  syncArbitraryBounds();
  if (arbitrary) {
    const a = parseDateInput(arbFrom.value);
    const b = parseDateInput(arbTo.value);
    if (Number.isFinite(a) && Number.isFinite(b) && b >= a) {
      const end = new Date(b);
      end.setDate(end.getDate() + 1);
      arbitrary = { start: a, end: end.getTime() };
    }
  }
  relayout();
  loop();
})();
  </script>
</body>
</html>
