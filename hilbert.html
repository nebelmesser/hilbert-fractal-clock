    const overflow = b.minL < inner.left - 1 || b.minT < inner.top - 1 ||
      b.maxR > inner.right + 1 || b.maxB > inner.bottom + 1;
    if (!overflow) return;
    const s = Math.min(innerW / contentW, innerH / contentH) * 0.97;
    if (!(s < 0.999) || s <= 0) return;
    for (let i = 0; i < vis.length; i++) {
      const tw = vis[i].map.tileW || vis[i].map.cssW;
      const th = vis[i].map.tileH || vis[i].map.cssH;
      applySlotBox(vis[i], Math.max(80, Math.floor(tw * s)), Math.max(80, Math.floor(th * s)));
    }
    requestAnimationFrame(drawAllConnectors);
  }

  function visWidthClose(pack) {
    const vis = fitSlots();
    if (vis.length !== pack.widths.length) return false;
    for (let i = 0; i < vis.length; i++) {
      const tw = vis[i].map.tileW || vis[i].map.cssW;
      const th = vis[i].map.tileH || vis[i].map.cssH;
      if (Math.abs(tw - pack.widths[i]) > 6) return false;
      if (Math.abs(th - pack.heights[i]) > 6) return false;
    }
    return true;
  }

  function scheduleRelayout() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const w = stageWidth();
      const h = window.innerHeight;
      if (Math.abs(w - lastLayoutWidth) < 8 && Math.abs(h - lastLayoutHeight) < 8) {
        requestAnimationFrame(drawAllConnectors);
        return;
      }
      relayout();
    }, 120);
  }

  function updateZoom(now, force, insetCssWidth) { // one inset; hide it when the parent cell is already ≤1s
    const main = slots[0] && slots[0].map;
    if (!main || !main.layout) return;
    const minute = Math.floor(now / 60000);
    let win = null;
    if (main.zoomRange && now >= main.zoomRange.start && now < main.zoomRange.end && main._zoomMinute === minute) {
      win = main.remapZoomRange(main.zoomRange.start, main.zoomRange.end);
    }
    if (!win) {
      win = main.pickZoomWindow(now);
      if (win) main._zoomMinute = minute;
    }
    if (!win) {
      main.setZoomHighlight(null);
      hideSlotsFrom(1);
      lastZoomKey = "none";
      requestAnimationFrame(drawAllConnectors);
      return;
    }
    const cssW = Math.max(80, Math.round(insetCssWidth || main.cssW));
    const rangeKey = win.start + "-" + win.end;
    const layoutKey = rangeKey + ":" + win.box.w + "x" + win.box.h + "k" + win.k + "@" + cssW;
    main.setZoomHighlight(win.box, { start: win.start, end: win.end });
    const inset = ensureSlot(1).map;
    if (force || inset._cropKey !== layoutKey) {
      inset.rebuildZoom(cssW, main.layout, win);
      inset._cropKey = layoutKey;
    } else if (Math.abs(inset.cssW - cssW) > 1) {
      inset.setDisplayWidth(cssW);
    }
    hideSlotsFrom(2);
    lastZoomKey = rangeKey;
    if (main.tileW > 8 && main.tileH > 8 && fitSlots().length > 1) {
      applySlotBox(slots[1], main.tileW, main.tileH);
    } else {
      inset.setDisplayWidth(main.cssW);
    }
    requestAnimationFrame(drawAllConnectors);
  }

  function drawAllConnectors() {
    const svgNS = "http://www.w3.org/2000/svg";
    while (connectors.firstChild) connectors.removeChild(connectors.firstChild);
    const stageRect = stage.getBoundingClientRect();
    connectors.setAttribute("viewBox", "0 0 " + stageRect.width + " " + stageRect.height);
    connectors.setAttribute("width", String(stageRect.width));
    connectors.setAttribute("height", String(stageRect.height));
    for (let i = 0; i < slots.length - 1; i++) {
      const a = slots[i];
      const b = slots[i + 1];
      if (a.block.style.display === "none" || b.block.style.display === "none") continue;
      const box = a.map.zoomBox;
      if (!box || !a.map.layout) continue;
      const grid = a.map.layout.grid;
      const mainRect = a.map.wrap.getBoundingClientRect();
      const insetRect = b.map.wrap.getBoundingClientRect();
      const cw = a.map.cssW / grid.w;
      const ch = a.map.cssH / grid.h;
      const ox = mainRect.left - stageRect.left;
      const oy = mainRect.top - stageRect.top;
      const ix = insetRect.left - stageRect.left;
      const iy = insetRect.top - stageRect.top;
      const side = stackEl.classList.contains("fit-row");
      const corners = side ? [ // row: from the right edge of the yellow box to the left of the inset
        [ox + (box.x + box.w) * cw, oy + box.y * ch, ix, iy],
        [ox + (box.x + box.w) * cw, oy + (box.y + box.h) * ch, ix, iy + insetRect.height]
      ] : [ // column / stack: from the bottom edge of the yellow box to the top of the inset
        [ox + box.x * cw, oy + (box.y + box.h) * ch, ix, iy],
        [ox + (box.x + box.w) * cw, oy + (box.y + box.h) * ch, ix + insetRect.width, iy]
      ];
      for (let k = 0; k < corners.length; k++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", corners[k][0]);
        line.setAttribute("y1", corners[k][1]);
        line.setAttribute("x2", corners[k][2]);
        line.setAttribute("y2", corners[k][3]);
        connectors.appendChild(line);
      }
    }
  }

  function applyArbitraryFromInputs() {
    const a = parseDateInput(arbFrom.value);
    const b = parseDateInput(arbTo.value);
    if (!Number.isFinite(a) || !Number.isFinite(b) || b < a) return;
    const end = new Date(b);
    end.setDate(end.getDate() + 1); // date inputs are inclusive; engine range is [start, end)
    const endMs = end.getTime();
    if (mode === "arbitrary" && arbitrary && arbitrary.start === a && arbitrary.end === endMs) return;
    arbitrary = { start: a, end: endMs };
    mode = "arbitrary";
    arbitraryRow.classList.add("open");
    saveFrame();
    renderPresetBar();
    relayout();
  }

  function scheduleArbitraryApply() {
    clearTimeout(arbTimer);
    arbTimer = setTimeout(applyArbitraryFromInputs, 1000);
  }

  arbFrom.addEventListener("input", scheduleArbitraryApply);
  arbTo.addEventListener("input", scheduleArbitraryApply);

  window.addEventListener("resize", scheduleRelayout);
  window.addEventListener("orientationchange", () => {
    lastLayoutWidth = 0;
    setTimeout(relayout, 200);
  });
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(scheduleRelayout).observe(stage);
  }

  function loop() {
    const now = nowMs();
    followLiveCalendar(now);
    let finest = 1000;
    for (let i = 0; i < slots.length; i++) {
      if (slots[i].block.style.display === "none" || !slots[i].map.layout) continue;
      slots[i].map.tick(now);
      finest = Math.min(finest, slots[i].map.layout.grid.cellDur);
    }
    if (zoomChainKey(now) !== lastZoomKey) updateZoom(now);
    const step = Math.max(16, Math.min(1000, finest));
    setTimeout(loop, clamp(step - (now % step), 16, 1000));
  }

  loadTheme();
  loadFrame();
  applyLayoutClass();
  renderPresetBar();
  arbitraryRow.classList.toggle("open", mode === "arbitrary");
  const now = nowMs();
  if (arbitrary) {
    arbFrom.value = localDateValue(arbitrary.start);
    arbTo.value = localDateValue(arbitrary.end - 1);
  } else {
    const today = rangeForMode("today", now);
    arbFrom.value = localDateValue(today.start);
    arbTo.value = localDateValue(today.end - 1);
  }
  relayout();
  loop();
})();
  </script>
</body>
</html>
